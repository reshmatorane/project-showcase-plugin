<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#713f12"/>
      <stop offset="50%" stop-color="#14532d"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="sun" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#facc15"/>
      <stop offset="100%" stop-color="#4ade80"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Solar Sun & Grid Rays -->
  <circle cx="280" cy="220" r="70" fill="url(#sun)" filter="url(#glow)"/>
  <g stroke="#fde047" stroke-width="3" opacity="0.6">
    <line x1="280" y1="110" x2="280" y2="70"/>
    <line x1="280" y1="330" x2="280" y2="370"/>
    <line x1="170" y1="220" x2="130" y2="220"/>
    <line x1="390" y1="220" x2="430" y2="220"/>
    <line x1="200" y1="140" x2="170" y2="110"/>
    <line x1="360" y1="300" x2="390" y2="330"/>
    <line x1="200" y1="300" x2="170" y2="330"/>
    <line x1="360" y1="140" x2="390" y2="110"/>
  </g>
  
  <!-- Info Box -->
  <rect x="480" y="270" width="260" height="150" rx="14" fill="#14532d" stroke="#4ade80" stroke-width="1.5" opacity="0.95"/>
  <text x="505" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#86efac" letter-spacing="1.5">CLEANTECH</text>
  <text x="505" y="345" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">SolarNova</text>
  <text x="505" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#bbf7d0">Distributed Grid Analytics</text>
</svg>
