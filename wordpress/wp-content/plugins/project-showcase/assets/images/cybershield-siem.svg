<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#450a0a"/>
      <stop offset="50%" stop-color="#18181b"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <linearGradient id="shield" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ef4444"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Cyber Shield Outline -->
  <path d="M 240 120 L 360 80 L 480 120 C 480 260 360 380 360 380 C 360 380 240 260 240 120 Z" fill="none" stroke="url(#shield)" stroke-width="6" filter="url(#glow)"/>
  <circle cx="360" cy="210" r="30" fill="#ef4444" opacity="0.8"/>
  <path d="M 345 210 L 355 220 L 375 200" fill="none" stroke="#ffffff" stroke-width="4" stroke-linecap="round"/>

  <!-- Info Box -->
  <rect x="490" y="270" width="260" height="150" rx="14" fill="#27272a" stroke="#ef4444" stroke-width="1.5" opacity="0.95"/>
  <text x="515" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f87171" letter-spacing="1.5">CYBERSECURITY</text>
  <text x="515" y="345" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">CyberShield</text>
  <text x="515" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#d4d4d8">Zero-Trust Threat SIEM</text>
</svg>
