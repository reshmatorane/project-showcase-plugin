<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#022c22"/>
      <stop offset="50%" stop-color="#064e3b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="680" cy="100" r="150" fill="#10b981" opacity="0.1" filter="url(#glow)"/>
  
  <!-- ECG Heartbeat Wave -->
  <path d="M 60 250 L 220 250 L 260 250 L 290 140 L 330 360 L 370 200 L 400 270 L 430 250 L 740 250" fill="none" stroke="url(#pulse)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  
  <!-- Cross Badge -->
  <circle cx="160" cy="150" r="44" fill="#065f46" stroke="#10b981" stroke-width="2"/>
  <rect x="154" y="126" width="12" height="48" rx="3" fill="#34d399"/>
  <rect x="136" y="144" width="48" height="12" rx="3" fill="#34d399"/>
  
  <!-- Stats Panel -->
  <rect x="490" y="290" width="250" height="150" rx="14" fill="#064e3b" stroke="#059669" stroke-width="1.5" opacity="0.95"/>
  <text x="515" y="330" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399" letter-spacing="1.5">HEALTHCARE</text>
  <text x="515" y="365" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">HealthPulse</text>
  <text x="515" y="400" font-family="system-ui, sans-serif" font-size="13" fill="#a7f3d0">Telehealth & EHR Suite</text>
</svg>
