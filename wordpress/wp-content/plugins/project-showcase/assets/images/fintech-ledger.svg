<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#6366f1"/>
      <stop offset="100%" stop-color="#a855f7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  <circle cx="650" cy="120" r="180" fill="#6366f1" opacity="0.12" filter="url(#glow)"/>
  <circle cx="150" cy="380" r="140" fill="#a855f7" opacity="0.1" filter="url(#glow)"/>
  
  <!-- Grid Lines -->
  <g stroke="#334155" stroke-width="1" opacity="0.3">
    <line x1="80" y1="80" x2="720" y2="80"/>
    <line x1="80" y1="180" x2="720" y2="180"/>
    <line x1="80" y1="280" x2="720" y2="280"/>
    <line x1="80" y1="380" x2="720" y2="380"/>
  </g>
  
  <!-- Financial Chart Bars -->
  <rect x="120" y="240" width="40" height="140" rx="6" fill="#4f46e5" opacity="0.8"/>
  <rect x="180" y="190" width="40" height="190" rx="6" fill="#6366f1" opacity="0.9"/>
  <rect x="240" y="220" width="40" height="160" rx="6" fill="#818cf8"/>
  <rect x="300" y="140" width="40" height="240" rx="6" fill="url(#accent)"/>
  <rect x="360" y="170" width="40" height="210" rx="6" fill="#a855f7" opacity="0.9"/>
  <rect x="420" y="110" width="40" height="270" rx="6" fill="url(#accent)" filter="url(#glow)"/>

  <!-- Treasury Nodes -->
  <path d="M 140 220 L 200 170 L 260 200 L 320 120 L 380 150 L 440 90" fill="none" stroke="#38bdf8" stroke-width="4" stroke-linecap="round"/>
  <circle cx="440" cy="90" r="8" fill="#38bdf8" filter="url(#glow)"/>

  <!-- Badge & Text -->
  <rect x="520" y="130" width="220" height="220" rx="16" fill="#1e293b" stroke="#475569" stroke-width="1.5" opacity="0.95"/>
  <text x="545" y="180" font-family="system-ui, sans-serif" font-size="14" font-weight="700" fill="#818cf8" letter-spacing="1.5">FINTECH</text>
  <text x="545" y="220" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">Apex Ledger</text>
  <text x="545" y="255" font-family="system-ui, sans-serif" font-size="13" fill="#94a3b8">Multi-Currency Treasury</text>
  <rect x="545" y="285" width="100" height="28" rx="6" fill="#312e81"/>
  <text x="562" y="303" font-family="system-ui, sans-serif" font-size="11" font-weight="600" fill="#a5b4fc">SUB-SECOND</text>
</svg>
