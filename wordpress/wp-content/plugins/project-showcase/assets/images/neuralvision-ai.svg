<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#311042"/>
      <stop offset="50%" stop-color="#1e1035"/>
      <stop offset="100%" stop-color="#090514"/>
    </linearGradient>
    <linearGradient id="neural" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#e879f9"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Neural Synapse Net -->
  <g stroke="url(#neural)" stroke-width="2" opacity="0.6">
    <line x1="160" y1="200" x2="280" y2="140"/>
    <line x1="160" y1="200" x2="280" y2="280"/>
    <line x1="280" y1="140" x2="400" y2="210"/>
    <line x1="280" y1="280" x2="400" y2="210"/>
    <line x1="400" y1="210" x2="520" y2="140"/>
    <line x1="400" y1="210" x2="520" y2="300"/>
  </g>
  <circle cx="160" cy="200" r="14" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="280" cy="140" r="10" fill="#e879f9"/>
  <circle cx="280" cy="280" r="12" fill="#818cf8"/>
  <circle cx="400" cy="210" r="18" fill="#f43f5e" filter="url(#glow)"/>
  <circle cx="520" cy="140" r="12" fill="#38bdf8"/>
  <circle cx="520" cy="300" r="14" fill="#e879f9"/>

  <!-- Info Box -->
  <rect x="490" y="270" width="260" height="150" rx="14" fill="#1e1035" stroke="#e879f9" stroke-width="1.5" opacity="0.95"/>
  <text x="515" y="310" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6" letter-spacing="1.5">ARTIFICIAL INTELLIGENCE</text>
  <text x="515" y="345" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">NeuralVision</text>
  <text x="515" y="380" font-family="system-ui, sans-serif" font-size="13" fill="#e9d5ff">Edge Vision Inference Model</text>
</svg>
