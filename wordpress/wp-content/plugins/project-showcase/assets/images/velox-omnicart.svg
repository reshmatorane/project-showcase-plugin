<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="800" height="500">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1b4b"/>
      <stop offset="50%" stop-color="#2e1065"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="glowgrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>
  <rect width="100%" height="100%" fill="url(#bg)"/>
  
  <!-- Modern Cart Graphic -->
  <path d="M 160 160 L 220 160 L 260 290 L 440 290 L 480 190 L 240 190" fill="none" stroke="url(#glowgrad)" stroke-width="6" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
  <circle cx="280" cy="350" r="20" fill="#a855f7"/>
  <circle cx="420" cy="350" r="20" fill="#ec4899"/>
  
  <!-- Badge Box -->
  <rect x="490" y="80" width="260" height="150" rx="14" fill="#3b0764" stroke="#a855f7" stroke-width="1.5" opacity="0.95"/>
  <text x="515" y="120" font-family="system-ui, sans-serif" font-size="13" font-weight="700" fill="#d8b4fe" letter-spacing="1.5">E-COMMERCE</text>
  <text x="515" y="155" font-family="system-ui, sans-serif" font-size="22" font-weight="800" fill="#ffffff">OmniCart</text>
  <text x="515" y="190" font-family="system-ui, sans-serif" font-size="13" fill="#f3e8ff">Headless Edge Storefront</text>
</svg>
